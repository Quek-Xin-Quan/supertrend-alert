name: ML SuperTrend Alert
 
on:
  workflow_dispatch:   # Triggered externally by cron-job.org every 5 minutes
 
jobs:
  run-alert:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install oandapyV20 pandas numpy requests
 
      - name: Run alert script
        env:
          # ── Secrets (set in GitHub → Settings → Secrets and variables → Actions)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN:         ${{ secrets.GIST_TOKEN }}
          GIST_ID:            ${{ secrets.GIST_ID }}
          OANDA_TOKEN:        ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV:          practice
          SYMBOLS:            "XAU_USD,EUR_USD,GBP_USD,AUD_USD,USD_CAD,USD_JPY,NZD_USD"
          INTERVAL:           "M5"
        run: python alert_script.py
